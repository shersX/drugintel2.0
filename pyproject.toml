[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "new-drugintel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "firecrawl>=4.32.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "jinja2>=3.1.0",
    "numpy>=2.0.0",
    "openai>=2.37.0",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "reportlab>=4.0.0",
    "scrapling[fetchers]>=0.4.8",
    "sqlalchemy>=2.0.0",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

# conda / pip：pip install -e .
# 只把 backend 当作包发现，避免把 data/frontend 等目录误打进发行包
[tool.setuptools.packages.find]
include = ["backend*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
