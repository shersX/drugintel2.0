# DrugIntel.ai 一键部署编排
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: drugintel-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "drugintel"
      POSTGRES_USER: "user"
      LANG: "en_US.UTF-8"
    volumes:
      # 相对 compose 文件所在的项目根目录：{本项目}/volumes/postgresql
      - ./volumes/postgresql:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d drugintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: drugintel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 前端在镜像构建时打包，和 API 一起由本服务在 :8000 提供，没有单独的前端容器
  app:
    build: .
    container_name: drugintel-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: "postgresql+psycopg://user:password@db:5432/drugintel"
      REDIS_URL: "redis://redis:6379/0"
      LLM_KEY_FILE: "/run/drugintel-secrets/llm.key"
    volumes:
      - ./data/secrets:/run/drugintel-secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    container_name: drugintel-worker
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: "postgresql+psycopg://user:password@db:5432/drugintel"
      REDIS_URL: "redis://redis:6379/0"
      LLM_KEY_FILE: "/run/drugintel-secrets/llm.key"
    volumes:
      - ./data/secrets:/run/drugintel-secrets
      # 增量已见 URL（JSON）；与库内 detail_url 一并用于列表页跳过详情
      - ./outjson:/app/outjson
    command: ["celery", "-A", "tasks.celery_app.celery_app", "worker", "-l", "info", "--concurrency", "1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  beat:
    build: .
    container_name: drugintel-beat
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: "postgresql+psycopg://user:password@db:5432/drugintel"
      REDIS_URL: "redis://redis:6379/0"
      LLM_KEY_FILE: "/run/drugintel-secrets/llm.key"
    volumes:
      - ./data/secrets:/run/drugintel-secrets
      - ./outjson:/app/outjson
    command: ["celery", "-A", "tasks.celery_app.celery_app", "beat", "-l", "info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

