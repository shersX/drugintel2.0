# PostgreSQL + pgvector + Redis
# Windows 请用 127.0.0.1 连接；数据目录必须在 Linux 文件系统（不可 /mnt/d）
services:
  drugintel-db:
    image: pgvector/pgvector:pg16
    container_name: drugintel-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "drugintel"
      POSTGRES_USER: "user"
      LANG: "en_US.UTF-8"
    volumes:
      - ${PGDATA_HOST_PATH:-/home/yj250019/drugintel-pgdata}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d drugintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  drugintel-redis:
    image: redis:7-alpine
    container_name: drugintel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # API 建议在宿主机用 uv run 启动以便使用本地 .env；如需容器化可自行扩展 Dockerfile
