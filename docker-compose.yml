# DrugIntel.ai 一键部署编排
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: drugintel-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "drugintel"
      POSTGRES_USER: "user"
      LANG: "en_US.UTF-8"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d drugintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: drugintel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: drugintel-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://user:password@db:5432/drugintel"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

